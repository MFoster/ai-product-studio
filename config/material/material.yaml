schema_version: "1.0"
materials:
  - slug: pla
    name: PLA
    nozzle_temperature_c:
      minimum: 190
      maximum: 230
    bed_temperature_c:
      minimum: 45
      maximum: 65
    minimum_wall_mm: 1.2
    shrink_compensation_percent: 0.2
    notes:
      - General-purpose rigid filament with low warping.
  - slug: petg
    name: PETG
    nozzle_temperature_c:
      minimum: 220
      maximum: 260
    bed_temperature_c:
      minimum: 70
      maximum: 90
    minimum_wall_mm: 1.2
    shrink_compensation_percent: 0.4
    notes:
      - Durable filament with good layer adhesion; manage stringing.
