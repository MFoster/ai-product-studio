[project]
name = "aps-blender-tools"
version = "0.1.0"
description = "Optional development checks for the Blender SDK scripts."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
blender = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.uv]
package = false
default-groups = []

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
